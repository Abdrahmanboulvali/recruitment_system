plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.recruitment_mobile"
    // تعديل: رفع الإصدار ليتوافق مع متطلبات المكتبات الجديدة
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // تعديل: استخدام Java 11 ليتوافق مع Gradle 8+ والنسخة التي ثبتناها
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId = "com.example.recruitment_mobile"

        // تعديل: رفع الحد الأدنى ليتوافق مع مكتبة التخزين الآمن (flutter_secure_storage)
        minSdk = 24

        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}